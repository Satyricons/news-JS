<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        
        <main>
            <div class="sources buttons"></div>
            <div class="news"></div>
        </main>

        <footer class="footer">
            <a href="https://github.com/Satyricons" target="_blank" class="footer__link">GitHub</a>
            <span class="footer__year">2026</span>
            <a href="https://rs.school/" target="_blank" class="footer__logo">
                
              <img id="rs-logo" alt="RS School" width="80" />
            </a>
        </footer>

        <!-- Шаблоны для JS -->
        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                   
                    <h2 class="news__title"></h2>
                    <h3 class="news__source"></h3>
                    <p class="news__description-text"></p>
                    <p class="news__more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
